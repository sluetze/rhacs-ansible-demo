---
# Bootstrap Ansible Automation Platform (Controller) and Event-Driven Ansible resources
# for the RHACS incident-response demo.
#
# Prerequisites:
#   ansible-galaxy collection install -r collections/requirements.yml -p collections
#   ansible-builder and podman (or docker) when aap_build_execution_environment is true
#
# Example:
#   ansible-playbook playbooks/configure_aap_eda.yml \
#     -e @example-aap-eda-vars.yml \
#     -e aap_gateway_host="$AAP_ENDPOINT" \
#     -e aap_oauth_token="$AAP_TOKEN" \
#     -e aap_project_scm_url="https://github.com/you/rhacs-ansible-demo.git" \
#     -e ocp_api="$OCP_API" -e ocp_token="$OCP_TOKEN"
#
- name: Configure Automation Controller (AAP)
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../vars/aap_eda_defaults.yml
  vars:
    # awx.awx modules (Galaxy-installable; works against AAP with CONTROLLER_OPTIONAL_API_URLPATTERN_PREFIX).
    # ansible.controller is Automation Hub only — not in collections/requirements.yml.
    _controller_host_raw: >-
      {{
        aap_controller_host
        | default(aap_gateway_host, true)
        | default(lookup('env', 'CONTROLLER_HOST'), true)
        | default(lookup('env', 'AAP_ENDPOINT'), true)
      }}
    _controller_host: "{{ _controller_host_raw | regex_replace('/api/controller/?$', '') | regex_replace('/$', '') }}"
    _controller_api_url: "{{ _controller_host ~ '/api/controller/' }}"
    # API auth comes from the attached OpenShift credential (host, bearer_token, verify_ssl).
    # Pass ocp_api / ocp_token only when creating that credential, not as job extra_vars.
    _job_template_extra_vars: "{{ aap_job_template_extra_vars }}"
    _aap_repo_root: "{{ playbook_dir | dirname }}"
    _aap_ee_image: "{{ aap_ee_image_repository }}:{{ aap_ee_image_tag }}"
    _aap_ee_registry_host: >-
      {{
        aap_ee_registry_host
        | default(aap_ee_image_repository.split('/')[0], true)
      }}
    _aap_ee_base_registry_host: >-
      {{
        aap_ee_base_registry_host
        | default(aap_ee_base_image.split('/')[0], true)
      }}
    _aap_ee_definition_path: "{{ _aap_repo_root }}/{{ aap_ee_definition_rendered }}"
    _aap_ee_image_repository_valid: >-
      {{
        (aap_ee_image_repository | default('', true) | length > 0)
        and (aap_ee_image_repository | default('', true) != 'quay.io/your-org/rhacs-ir-ee')
      }}
    _aap_ee_register_on_controller: >-
      {{
        (aap_configure_execution_environment | default(false) | bool)
        or (_aap_ee_image_repository_valid | bool)
      }}
    _aap_ee_build_effective: >-
      {{
        (aap_build_execution_environment | default(false) | bool)
        and (_aap_ee_image_repository_valid | bool)
      }}
    # Base vs push registry auth (unset aap_ee_*_registry_* falls back to shared aap_ee_registry_username/password)
    _aap_ee_base_registry_username: >-
      {{
        aap_ee_base_registry_username
        | default(aap_ee_registry_username | default('', true), true)
      }}
    _aap_ee_base_registry_password: >-
      {{
        aap_ee_base_registry_password
        | default(aap_ee_registry_password | default('', true), true)
      }}
    _aap_ee_push_registry_username: >-
      {{
        aap_ee_push_registry_username
        | default(aap_ee_registry_username | default('', true), true)
      }}
    _aap_ee_push_registry_password: >-
      {{
        aap_ee_push_registry_password
        | default(aap_ee_registry_password | default('', true), true)
      }}
    _aap_ee_registries_differ: >-
      {{
        (_aap_ee_registry_host != _aap_ee_base_registry_host)
        or (_aap_ee_push_registry_username != _aap_ee_base_registry_username)
        or (_aap_ee_push_registry_password != _aap_ee_base_registry_password)
      }}
    # Deprecated alias aap_configure_ee_registry_credential wins when set via -e (defaults only define attach)
    _aap_ee_attach_registry_credential_effective: >-
      {{
        (
          aap_configure_ee_registry_credential
          if (aap_configure_ee_registry_credential is defined)
          else (aap_ee_attach_registry_credential | default(true))
        ) | bool
      }}
    # podman/docker login before push — never tied to Controller credential creation
    _aap_ee_push_registry_login: >-
      {{
        (_aap_ee_build_effective | bool)
        and (aap_ee_push_image | default(true) | bool)
        and (aap_ee_registry_login | default(true) | bool)
        and (_aap_ee_registry_host | length > 0)
        and (_aap_ee_push_registry_username | length > 0)
        and (_aap_ee_push_registry_password | length > 0)
      }}
    # Create on Controller + attach to EE when push registry auth is configured
    _aap_ee_use_registry_credential: >-
      {{
        (_aap_ee_attach_registry_credential_effective | bool)
        and (aap_ee_registry_credential_name | length > 0)
        and (_aap_ee_registry_host | length > 0)
        and (_aap_ee_push_registry_username | length > 0)
        and (_aap_ee_push_registry_password | length > 0)
      }}
  environment:
    CONTROLLER_OPTIONAL_API_URLPATTERN_PREFIX: /api/controller/
  module_defaults:
    group/awx.awx.controller:
      controller_host: "{{ _controller_host }}"
      controller_oauthtoken: "{{ aap_oauth_token | default(omit) }}"
      controller_username: "{{ aap_controller_username | default(lookup('env', 'CONTROLLER_USERNAME'), true) | default(omit) }}"
      controller_password: "{{ aap_controller_password | default(lookup('env', 'CONTROLLER_PASSWORD'), true) | default(omit) }}"
      validate_certs: "{{ aap_controller_validate_certs | default(true) | bool }}"
  tags:
    - controller
  tasks:
    - name: Require Controller connection settings
      ansible.builtin.assert:
        that:
          - _controller_host is defined
          - _controller_host | length > 0
          - >-
            (aap_oauth_token is defined and (aap_oauth_token | string | length) > 0)
            or (
              (aap_controller_username | default(lookup('env', 'CONTROLLER_USERNAME'), true) | length) > 0
              and (aap_controller_password | default(lookup('env', 'CONTROLLER_PASSWORD'), true) | length) > 0
            )
        fail_msg: >-
          Set aap_gateway_host + aap_oauth_token, or aap_controller_host with username/password
          (or CONTROLLER_HOST / CONTROLLER_USERNAME / CONTROLLER_PASSWORD).

    - name: Create Controller project
      awx.awx.project:
        name: "{{ aap_project_name }}"
        description: RHACS incident response demo content
        organization: "{{ aap_organization }}"
        scm_type: git
        scm_url: "{{ aap_project_scm_url }}"
        scm_branch: "{{ aap_project_scm_branch }}"
        scm_update_on_launch: "{{ aap_project_scm_update_on_launch | bool }}"
      tags: [controller]

    - name: Schedule Controller project SCM sync
      when: aap_configure_project_sync_schedule | bool
      awx.awx.schedule:
        name: "{{ aap_project_sync_schedule_name }}"
        description: Periodic SCM sync for {{ aap_project_name }}
        organization: "{{ aap_organization }}"
        unified_job_template: "{{ aap_project_name }}"
        enabled: "{{ aap_project_sync_schedule_enabled | bool }}"
        rrule: "{{ aap_project_sync_schedule_rrule }}"
      tags: [controller]

    - name: Require ocp_api and ocp_token when configuring OCP credential
      when: aap_configure_ocp_credential | bool
      ansible.builtin.assert:
        that:
          - ocp_api is defined and ocp_api | length > 0
          - ocp_token is defined and ocp_token | length > 0
        fail_msg: >-
          Define ocp_api and ocp_token (or set aap_configure_ocp_credential: false).

    - name: Create OpenShift API credential for job template
      when: aap_configure_ocp_credential | bool
      awx.awx.credential:
        name: "{{ aap_ocp_credential_name }}"
        description: Bearer token for rhacs-ir-runner (or equivalent)
        organization: "{{ aap_organization }}"
        credential_type: "{{ aap_ocp_credential_type }}"
        inputs:
          host: "{{ ocp_api }}"
          bearer_token: "{{ ocp_token }}"
          verify_ssl: "{{ ocp_verify_ssl | default(false) | bool }}"

    - name: Require execution environment image repository
      when: _aap_ee_register_on_controller | bool or _aap_ee_build_effective | bool
      tags: [execution_environment, controller]
      ansible.builtin.assert:
        that:
          - aap_ee_image_repository is defined
          - aap_ee_image_repository | length > 0
          - aap_ee_image_repository != 'quay.io/your-org/rhacs-ir-ee'
        fail_msg: >-
          Set aap_ee_image_repository in aap-eda-vars.yml to a registry path you can push to
          and AAP can pull (for example quay.io/<user>/rhacs-ir-ee). Do not use the
          documentation placeholder quay.io/your-org/rhacs-ir-ee.

    - name: Check ansible-builder is available
      when: _aap_ee_build_effective | bool
      tags: [execution_environment, controller]
      ansible.builtin.command:
        cmd: "{{ aap_ee_builder_bin }} --version"
      register: _aap_ee_builder_version
      changed_when: false

    - name: Check container CLI is available
      when: _aap_ee_build_effective | bool
      tags: [execution_environment, controller]
      ansible.builtin.command:
        cmd: "{{ aap_ee_container_cli }} --version"
      register: _aap_ee_container_cli_version
      changed_when: false

    - name: Require base registry credentials when automated EE login is enabled
      when:
        - _aap_ee_build_effective | bool
        - aap_ee_registry_login | default(true) | bool
      tags: [execution_environment, controller]
      ansible.builtin.assert:
        that:
          - _aap_ee_base_registry_username | length > 0
          - _aap_ee_base_registry_password | length > 0
        fail_msg: >-
          Set aap_ee_base_registry_username and aap_ee_base_registry_password (or shared
          aap_ee_registry_username / aap_ee_registry_password) for the base image registry
          {{ _aap_ee_base_registry_host }}, or pass -e aap_ee_registry_login=false after manual login.

    - name: Require push registry credentials when push and automated login are enabled
      when: _aap_ee_push_registry_login | bool
      tags: [execution_environment, controller]
      ansible.builtin.assert:
        that:
          - _aap_ee_push_registry_username | length > 0
          - _aap_ee_push_registry_password | length > 0
        fail_msg: >-
          Set aap_ee_push_registry_username and aap_ee_push_registry_password (or shared
          aap_ee_registry_username / aap_ee_registry_password) for the push registry
          {{ _aap_ee_registry_host }}, or pass -e aap_ee_registry_login=false after manual login.

    - name: Ensure EE build output directory exists
      when: _aap_ee_build_effective | bool
      ansible.builtin.file:
        path: "{{ _aap_repo_root }}/.build"
        state: directory
        mode: "0755"
      tags: [execution_environment, controller]

    - name: Render execution-environment definition for ansible-builder
      when: _aap_ee_build_effective | bool
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/execution-environment.yml.j2"
        dest: "{{ _aap_ee_definition_path }}"
        mode: "0644"
      tags: [execution_environment, controller]

    - name: Log in to base image registry for EE build
      when:
        - _aap_ee_build_effective | bool
        - aap_ee_registry_login | default(true) | bool
        - _aap_ee_base_registry_host | length > 0
        - _aap_ee_base_registry_username | length > 0
        - _aap_ee_base_registry_password | length > 0
      ansible.builtin.shell:
        cmd: >-
          {{ aap_ee_container_cli }} login {{ _aap_ee_base_registry_host }}
          --username {{ _aap_ee_base_registry_username | quote }} --password-stdin
        stdin: "{{ _aap_ee_base_registry_password }}"
      changed_when: false
      no_log: true
      tags: [execution_environment, controller]

    - name: Note when base and push registry logins differ
      when:
        - _aap_ee_build_effective | bool
        - aap_ee_registry_login | default(true) | bool
        - _aap_ee_registries_differ | bool
      ansible.builtin.debug:
        msg: >-
          Using separate registry auth: base {{ _aap_ee_base_registry_host }}
          (user {{ _aap_ee_base_registry_username }}){% if aap_ee_push_image | bool %},
          push {{ _aap_ee_registry_host }} (user {{ _aap_ee_push_registry_username }}){% endif %}.
      tags: [execution_environment, controller]

    - name: Build execution environment image
      when: _aap_ee_build_effective | bool
      tags: [execution_environment, controller]
      ansible.builtin.command:
        argv:
          - "{{ aap_ee_builder_bin }}"
          - build
          - -f
          - "{{ aap_ee_definition_rendered }}"
          - -t
          - "{{ _aap_ee_image }}"
          - -c
          - "{{ aap_ee_container_cli }}"
        chdir: "{{ _aap_repo_root }}"
      register: _aap_ee_build
      changed_when: _aap_ee_build.rc == 0

    - name: Log in to push registry for EE image upload
      # Uses _aap_ee_push_registry_login — not aap_ee_attach_registry_credential / _aap_ee_use_registry_credential.
      when: _aap_ee_push_registry_login | bool
      ansible.builtin.shell:
        cmd: >-
          {{ aap_ee_container_cli }} login {{ _aap_ee_registry_host }}
          --username {{ _aap_ee_push_registry_username | quote }} --password-stdin
        stdin: "{{ _aap_ee_push_registry_password }}"
      changed_when: false
      no_log: true
      tags: [execution_environment, controller]

    - name: Push execution environment image to registry
      when:
        - _aap_ee_build_effective | bool
        - aap_ee_push_image | bool
      ansible.builtin.command:
        argv:
          - "{{ aap_ee_container_cli }}"
          - push
          - "{{ _aap_ee_image }}"
      register: _aap_ee_push
      changed_when: _aap_ee_push.rc == 0
      tags: [execution_environment, controller]

    - name: Create Container Registry credential for execution environment pull
      when: _aap_ee_use_registry_credential | bool
      awx.awx.credential:
        name: "{{ aap_ee_registry_credential_name }}"
        description: Registry pull secret for {{ aap_execution_environment_name }} (push registry)
        organization: "{{ aap_organization }}"
        credential_type: Container Registry
        inputs:
          host: "{{ _aap_ee_registry_host }}"
          username: "{{ _aap_ee_push_registry_username }}"
          password: "{{ _aap_ee_push_registry_password }}"
      no_log: true
      tags: [execution_environment, controller]

    - name: Register execution environment on Controller (with registry credential)
      when:
        - _aap_ee_register_on_controller | bool
        - _aap_ee_use_registry_credential | bool
      awx.awx.execution_environment:
        name: "{{ aap_execution_environment_name }}"
        description: >-
          RHACS incident response — collections from collections/requirements.yml
          (community.general, kubernetes.core, awx.awx, ansible.eda).
        organization: "{{ aap_organization }}"
        image: "{{ _aap_ee_image }}"
        pull: "{{ aap_ee_image_pull }}"
        credential: "{{ aap_ee_registry_credential_name }}"
      tags: [execution_environment, controller]

    - name: Register execution environment on Controller (no registry credential)
      when:
        - _aap_ee_register_on_controller | bool
        - not (_aap_ee_use_registry_credential | bool)
      awx.awx.execution_environment:
        name: "{{ aap_execution_environment_name }}"
        description: >-
          RHACS incident response — collections from collections/requirements.yml
          (community.general, kubernetes.core, awx.awx, ansible.eda).
        organization: "{{ aap_organization }}"
        image: "{{ _aap_ee_image }}"
        pull: "{{ aap_ee_image_pull }}"
      tags: [execution_environment, controller]

    - name: Show execution environment image
      when: _aap_ee_register_on_controller | bool
      ansible.builtin.debug:
        msg: >-
          Job template {{ aap_job_template_name }} uses execution environment
          {{ aap_execution_environment_name }} (image {{ _aap_ee_image }}).
      tags: [execution_environment, controller]

    - name: Create incident response job template (custom execution environment)
      when: _aap_ee_register_on_controller | bool
      awx.awx.job_template:
        name: "{{ aap_job_template_name }}"
        description: RHACS runtime violation — logs, checkpoint, NetworkPolicy
        organization: "{{ aap_organization }}"
        project: "{{ aap_project_name }}"
        playbook: "{{ aap_job_template_playbook }}"
        inventory: "{{ aap_job_template_inventory }}"
        execution_environment: "{{ aap_execution_environment_name }}"
        extra_vars: "{{ _job_template_extra_vars }}"
        ask_variables_on_launch: true
        job_type: run

    - name: Create incident response job template (platform default execution environment)
      when: not (_aap_ee_register_on_controller | bool)
      awx.awx.job_template:
        name: "{{ aap_job_template_name }}"
        description: RHACS runtime violation — logs, checkpoint, NetworkPolicy
        organization: "{{ aap_organization }}"
        project: "{{ aap_project_name }}"
        playbook: "{{ aap_job_template_playbook }}"
        inventory: "{{ aap_job_template_inventory }}"
        extra_vars: "{{ _job_template_extra_vars }}"
        ask_variables_on_launch: true
        job_type: run

    - name: Attach OpenShift credential to job template
      when: aap_configure_ocp_credential | bool
      awx.awx.job_template:
        name: "{{ aap_job_template_name }}"
        organization: "{{ aap_organization }}"
        credentials:
          - "{{ aap_ocp_credential_name }}"

- name: Configure Event-Driven Ansible (EDA)
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../vars/aap_eda_defaults.yml
  vars:
    # ansible.eda modules expect the platform base URL (no /api/eda); the client adds /api/eda/v1.
    _eda_host_raw: >-
      {{
        eda_controller_host
        | default(aap_gateway_host, true)
        | default(aap_controller_host, true)
        | default(lookup('env', 'EDA_HOST'), true)
        | default(lookup('env', 'AAP_ENDPOINT'), true)
      }}
    _eda_host: "{{ _eda_host_raw | regex_replace('/api/eda/?$', '') | regex_replace('/api/controller/?$', '') | regex_replace('/$', '') }}"
    _controller_api_url: "{{ _eda_host ~ '/api/controller/' }}"
    # Job template uses the Controller OpenShift credential; EDA activation does not need API tokens.
    _eda_activation_extra_vars: "{{ eda_rulebook_activation_extra_vars }}"
  module_defaults:
    group/ansible.eda.eda:
      controller_host: "{{ _eda_host }}"
      controller_token: "{{ eda_oauth_token | default(aap_oauth_token, true) | default(omit) }}"
      controller_username: "{{ eda_username | default(aap_controller_username, true) | default(lookup('env', 'CONTROLLER_USERNAME'), true) | default(omit) }}"
      controller_password: "{{ eda_password | default(aap_controller_password, true) | default(lookup('env', 'CONTROLLER_PASSWORD'), true) | default(omit) }}"
      validate_certs: "{{ eda_validate_certs | default(aap_controller_validate_certs | default(true)) | bool }}"
  tags:
    - eda
  tasks:
    - name: Require EDA connection settings
      ansible.builtin.assert:
        that:
          - _eda_host is defined
          - _eda_host | length > 0
        fail_msg: Set eda_controller_host, aap_gateway_host, or AAP_ENDPOINT / EDA_HOST.

    - name: Create EDA decision environment
      ansible.eda.decision_environment:
        name: "{{ eda_decision_environment_name }}"
        description: ansible-rulebook + ansible.eda for RHACS webhook rulebook
        image_url: "{{ eda_decision_environment_image }}"
        organization_name: "{{ eda_organization }}"

    - name: Create or update EDA project
      ansible.eda.project:
        name: "{{ eda_project_name }}"
        description: RHACS EDA rulebooks and playbooks
        url: "{{ aap_project_scm_url }}"
        scm_branch: "{{ aap_project_scm_branch }}"
        organization_name: "{{ eda_organization }}"
        wait: true

    - name: Sync EDA project and wait for rulebooks
      ansible.eda.project:
        name: "{{ eda_project_name }}"
        organization_name: "{{ eda_organization }}"
        sync: true
        wait: true
      register: eda_project_sync
      retries: 20
      delay: 15
      until: eda_project_sync is not failed

    - name: Create EDA credential for Automation Controller
      ansible.eda.credential:
        name: "{{ eda_aap_credential_name }}"
        description: Lets rulebook activations launch job templates on Controller
        credential_type_name: "{{ eda_aap_credential_type }}"
        organization_name: "{{ eda_organization }}"
        inputs: >-
          {{
            eda_aap_credential_inputs | default({
              'host': _controller_api_url,
              'username': aap_controller_username | default(lookup('env', 'CONTROLLER_USERNAME'), true),
              'password': aap_controller_password | default(lookup('env', 'CONTROLLER_PASSWORD'), true),
            }, true)
          }}

    - name: Require event stream username and password
      when: eda_use_event_stream | bool
      ansible.builtin.assert:
        that:
          - >-
            (eda_event_stream_username | default(aap_controller_username, true) | length) > 0
          - >-
            (eda_event_stream_password | default(aap_controller_password, true) | length) > 0
        fail_msg: >-
          Define eda_event_stream_username and eda_event_stream_password, or reuse
          aap_controller_username and aap_controller_password.

    - name: Create Basic Event Stream credential for RHACS webhook auth
      when: eda_use_event_stream | bool
      ansible.eda.credential:
        name: "{{ eda_event_stream_credential_name }}"
        description: HTTP basic auth for RHACS generic webhook → EDA event stream
        credential_type_name: "{{ eda_event_stream_credential_type }}"
        organization_name: "{{ eda_organization }}"
        inputs:
          username: "{{ eda_event_stream_username | default(aap_controller_username, true) }}"
          password: "{{ eda_event_stream_password | default(aap_controller_password, true) }}"

    - name: List rulebooks in EDA project
      ansible.eda.rulebook_info:
        project_name: "{{ eda_project_name }}"
      register: eda_rulebooks

    - name: Resolve rulebook name from project sync
      ansible.builtin.set_fact:
        eda_rulebook_name_resolved: >-
          {{
            (eda_rulebooks.rulebooks | selectattr('name', 'search', 'rhacs_webhook')
             | map(attribute='name') | list | first)
            | default(eda_rulebook_name)
          }}

    - name: Fail when RHACS rulebook is missing from EDA project
      ansible.builtin.assert:
        that:
          - eda_rulebooks.rulebooks | selectattr('name', 'equalto', eda_rulebook_name_resolved) | list | length > 0
        fail_msg: >-
          No rulebook matching {{ eda_rulebook_name }} in project {{ eda_project_name }}.
          Rulebooks found: {{ eda_rulebooks.rulebooks | map(attribute='name') | list }}.

    - name: Load sample RHACS event for rulebook validation
      ansible.builtin.set_fact:
        _rhacs_sample_event: "{{ lookup('file', playbook_dir ~ '/../event.json') | from_json }}"

    - name: Validate sample event matches rulebook payload shape
      ansible.builtin.assert:
        that:
          - _rhacs_sample_event.payload is defined
          - _rhacs_sample_event.payload.alert is defined
          - _rhacs_sample_event.payload.alert.namespace is defined
          - _rhacs_sample_event.payload.alert.processViolation is defined
          - _rhacs_sample_event.payload.alert.processViolation.processes | length > 0
          - _rhacs_sample_event.payload.alert.processViolation.processes[0].podId is defined
        fail_msg: >-
          event.json must expose payload.alert with processViolation.processes[0].podId
          (runtime alerts). The rulebook uses bracket notation on event.payload['alert'].

    - name: Create RHACS event stream
      when: eda_use_event_stream | bool
      ansible.eda.event_stream:
        name: "{{ eda_event_stream_name }}"
        organization_name: "{{ eda_organization }}"
        credential_name: "{{ eda_event_stream_credential_name }}"
        forward_events: true
      register: eda_event_stream_result

    - name: Show RHACS webhook URL for event stream
      when:
        - eda_use_event_stream | bool
        - eda_event_stream_result is changed or eda_event_stream_result.id is defined
      ansible.builtin.debug:
        msg: >-
          Configure RHACS Generic webhook to POST to your EDA event stream endpoint
          (Automation Decisions → Event Streams → {{ eda_event_stream_name }}).
          Use HTTP basic auth (username/password) matching credential {{ eda_event_stream_credential_name }}.

    - name: Create rulebook activation (RHACS event stream)
      when: eda_use_event_stream | bool
      ansible.eda.rulebook_activation:
        name: "{{ eda_rulebook_activation_name }}"
        description: RHACS policy violations → {{ aap_job_template_name }}
        organization_name: "{{ eda_organization }}"
        project_name: "{{ eda_project_name }}"
        rulebook_name: "{{ eda_rulebook_name_resolved }}"
        decision_environment_name: "{{ eda_decision_environment_name }}"
        eda_credentials:
          - "{{ eda_aap_credential_name }}"
        extra_vars: "{{ _eda_activation_extra_vars | to_json }}"
        event_streams:
          - event_stream: "{{ eda_event_stream_name }}"
            source_name: "{{ eda_rulebook_source_name }}"
        state: enabled
        restart_on_project_update: true

    - name: Create rulebook activation (embedded webhook)
      when: not (eda_use_event_stream | bool)
      ansible.eda.rulebook_activation:
        name: "{{ eda_rulebook_activation_name }}"
        description: RHACS policy violations → {{ aap_job_template_name }}
        organization_name: "{{ eda_organization }}"
        project_name: "{{ eda_project_name }}"
        rulebook_name: "{{ eda_rulebook_name_resolved }}"
        decision_environment_name: "{{ eda_decision_environment_name }}"
        eda_credentials:
          - "{{ eda_aap_credential_name }}"
        extra_vars: "{{ _eda_activation_extra_vars | to_json }}"
        state: enabled
        restart_on_project_update: true
