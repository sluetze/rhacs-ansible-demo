---
# Update the Controller OpenShift / Kubernetes API Bearer Token credential only.
# Use when local ansible-navigator runs work but AAP jobs fail with K8S auth errors.
#
# The credential injects K8S_AUTH_HOST, K8S_AUTH_API_KEY, and K8S_AUTH_VERIFY_SSL at job launch.
#
# Example (token from aap-eda-vars.yml):
#   ansible-playbook playbooks/update_aap_ocp_credential.yml \
#     -e @aap-eda-vars.yml \
#     -e aap_oauth_token="$AAP_TOKEN"
#
# Example (token from shell / .env):
#   source .env
#   ansible-playbook playbooks/update_aap_ocp_credential.yml \
#     -e @aap-eda-vars.yml \
#     -e ocp_api="$K8S_AUTH_HOST" \
#     -e ocp_token="$K8S_AUTH_API_KEY"
#
- name: Update RHACS IR OpenShift API credential on Automation Controller
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../vars/aap_eda_defaults.yml
  vars:
    _controller_host_raw: >-
      {{
        aap_controller_host
        | default(aap_gateway_host, true)
        | default(lookup('env', 'CONTROLLER_HOST'), true)
        | default(lookup('env', 'AAP_ENDPOINT'), true)
      }}
    _controller_host: "{{ _controller_host_raw | regex_replace('/api/controller/?$', '') | regex_replace('/$', '') }}"
    _ocp_api_effective: >-
      {{
        ocp_api
        | default(lookup('env', 'K8S_AUTH_HOST', default=''), true)
        | trim
      }}
    _ocp_token_effective: >-
      {{
        ocp_token
        | default(lookup('env', 'K8S_AUTH_API_KEY', default=''), true)
        | default(lookup('env', 'K8S_AUTH_TOKEN', default=''), true)
        | trim
      }}
    _ocp_verify_ssl_effective: >-
      {{
        (
          ocp_verify_ssl
          | default(lookup('env', 'K8S_AUTH_VERIFY_SSL', default=''), true)
          | default(false)
        ) | bool
      }}
  environment:
    CONTROLLER_OPTIONAL_API_URLPATTERN_PREFIX: /api/controller/
  module_defaults:
    group/awx.awx.controller:
      controller_host: "{{ _controller_host }}"
      controller_oauthtoken: "{{ aap_oauth_token | default(omit) }}"
      controller_username: "{{ aap_controller_username | default(lookup('env', 'CONTROLLER_USERNAME'), true) | default(omit) }}"
      controller_password: "{{ aap_controller_password | default(lookup('env', 'CONTROLLER_PASSWORD'), true) | default(omit) }}"
      validate_certs: "{{ aap_controller_validate_certs | default(true) | bool }}"

  tasks:
    - name: Require Controller connection settings
      ansible.builtin.assert:
        that:
          - _controller_host is defined
          - _controller_host | length > 0
          - >-
            (aap_oauth_token is defined and (aap_oauth_token | string | length) > 0)
            or (
              (aap_controller_username | default(lookup('env', 'CONTROLLER_USERNAME'), true) | length) > 0
              and (aap_controller_password | default(lookup('env', 'CONTROLLER_PASSWORD'), true) | length) > 0
            )
        fail_msg: >-
          Set aap_gateway_host + aap_oauth_token, or aap_controller_host with username/password
          (or CONTROLLER_HOST / CONTROLLER_USERNAME / CONTROLLER_PASSWORD).

    - name: Require OpenShift API URL and bearer token
      ansible.builtin.assert:
        that:
          - _ocp_api_effective | length > 0
          - _ocp_token_effective | length > 0
        fail_msg: >-
          Pass -e ocp_api=... -e ocp_token=..., set them in aap-eda-vars.yml,
          or export K8S_AUTH_HOST and K8S_AUTH_API_KEY (see .env).

    - name: Update OpenShift API credential on Controller
      awx.awx.credential:
        name: "{{ aap_ocp_credential_name }}"
        description: Bearer token for rhacs-ir-runner (or equivalent)
        organization: "{{ aap_organization }}"
        credential_type: "{{ aap_ocp_credential_type }}"
        state: present
        update_secrets: true
        inputs:
          host: "{{ _ocp_api_effective }}"
          bearer_token: "{{ _ocp_token_effective }}"
          verify_ssl: "{{ _ocp_verify_ssl_effective }}"
      no_log: true
      register: _ocp_credential_result

    - name: Ensure job template attaches OpenShift credential
      when: aap_ensure_job_template_credential | default(true) | bool
      awx.awx.job_template:
        name: "{{ aap_job_template_name }}"
        organization: "{{ aap_organization }}"
        credentials:
          - "{{ aap_ocp_credential_name }}"
      register: _job_template_result

    - name: Summarize credential update
      ansible.builtin.debug:
        msg: >-
          Updated credential '{{ aap_ocp_credential_name }}' for {{ _ocp_api_effective }}
          (verify_ssl={{ _ocp_verify_ssl_effective }}).
          {% if aap_ensure_job_template_credential | default(true) | bool %}
          Job template '{{ aap_job_template_name }}' credentials:
          {{ _job_template_result.credentials | default([aap_ocp_credential_name]) | join(', ') }}.
          {% else %}
          Job template attachment skipped (aap_ensure_job_template_credential=false).
          {% endif %}
          Re-run the RHACS job template and confirm K8S auth succeeds.
