---
# Containment + forensics when driven by RHACS (via EDA / Controller extra vars).
# Authenticate with the rhacs-ir-runner ServiceAccount token (or equivalent RBAC), not cluster-admin.
#
# Required extra vars (either explicit or from rhacs_webhook_payload):
#   - target_namespace
#   - target_pod
# Optional:
#   - target_container (defaults to first container; used for kubelet checkpoint only; logs collected for every container)
#   - networkpolicy_name, policy_name
#   - evidence_dir (default: ~/rhacs-ir-evidence/<timestamp> on controller)
#   - host, bearer_token, verify_ssl (local runs; AAP uses K8S_AUTH_* from attached credential)
#   - enable_checkpoint_collection: false to skip kubelet checkpoint (default true)
#   - enable_nodelog_collection: false skips oc adm node-logs (default true; RHACS IR EE installs oc)
#   - evidence_publish_enabled: false to skip zip + nginx download pod (tag publish)
#   - evidence_ir_namespace (default rhacs-incident-response)
#   - evidence_nginx_image (default registry.access.redhat.com/hi/nginx:latest)
#   - evidence_stager_image / evidence_stager_container_name (ubi9 sidecar with tar; k8s_cp target)
#
- name: RHACS incident response — logs, optional checkpoint, NetworkPolicy containment
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    # Prefer active venv (source .venv/bin/activate) or set RHACS_ANSIBLE_PYTHON to your interpreter
    ansible_python_interpreter: >-
      {{ (lookup('env', 'VIRTUAL_ENV') ~ '/bin/python') if (lookup('env', 'VIRTUAL_ENV', default='') | length > 0)
         else lookup('env', 'RHACS_ANSIBLE_PYTHON', default='/usr/bin/python3') }}
    # Resolved at play load from AAP credential env, --penv, or -e host/bearer_token (before pre_tasks).
    _k8s_auth_host: >-
      {{
        lookup('env', 'K8S_AUTH_HOST')
        | default(host | default('', true), true)
        | default(ocp_api | default('', true), true)
        | trim
      }}
    _k8s_auth_token: >-
      {{
        lookup('env', 'K8S_AUTH_API_KEY')
        | default(lookup('env', 'K8S_AUTH_TOKEN', default=''), true)
        | default(bearer_token | default('', true), true)
        | default(ocp_token | default('', true), true)
        | trim
      }}
    _k8s_auth_verify_ssl: >-
      {{
        (
          lookup('env', 'K8S_AUTH_VERIFY_SSL')
          | default(verify_ssl | default('', true), true)
          | default(ocp_verify_ssl | default(false))
        ) | bool
      }}
  # AAP injects K8S_AUTH_* from the OpenShift credential; local runs set them in pre_tasks.
  environment:
    K8S_AUTH_HOST: "{{ _k8s_auth_host | default('') }}"
    K8S_AUTH_API_KEY: "{{ _k8s_auth_token | default('') }}"
    K8S_AUTH_VERIFY_SSL: "{{ (_k8s_auth_verify_ssl | default(false) | bool) | string | lower }}"
  # kubernetes.core reads K8S_AUTH_* env vars; module_defaults also pass host/api_key explicitly
  # so auth works inside ansible-navigator EEs when --penv or -e bearer_token is used.
  module_defaults:
    group/kubernetes.core.k8s:
      host: "{{ _k8s_auth_host }}"
      api_key: "{{ _k8s_auth_token }}"
      validate_certs: "{{ _k8s_auth_verify_ssl | bool }}"

  pre_tasks:
    - name: Set rhacs_webhook_payload from ansible_eda when running directly from EDA
      ansible.builtin.set_fact:
        rhacs_webhook_payload: "{{ ansible_eda.event }}"
      when:
        - ansible_eda is defined
        - ansible_eda.event is defined
        - rhacs_webhook_payload is not defined or (rhacs_webhook_payload | default('') | length == 0)

    - name: Mirror resolved auth for uri and oc tasks
      ansible.builtin.set_fact:
        host: "{{ _k8s_auth_host }}"
        bearer_token: "{{ _k8s_auth_token }}"
        verify_ssl: "{{ _k8s_auth_verify_ssl }}"
      no_log: true

    - name: Require OpenShift API URL and bearer token
      ansible.builtin.assert:
        that:
          - _k8s_auth_host | length > 0
          - _k8s_auth_token | length > 0
        fail_msg: >-
          Attach an OpenShift or Kubernetes API Bearer Token credential to the job template
          (injects K8S_AUTH_HOST / K8S_AUTH_API_KEY), or pass -e host=... -e bearer_token=... for ad-hoc runs.

    - name: Verify OpenShift API bearer token (fail fast before kubernetes.core)
      ansible.builtin.uri:
        url: "{{ host }}/version"
        method: GET
        headers:
          Authorization: "Bearer {{ bearer_token }}"
        validate_certs: "{{ verify_ssl | bool }}"
        status_code: [200]
      no_log: true

    - name: Print full event
      ansible.builtin.debug:
        var: ansible_eda.event
      when:
        - ansible_eda.event is defined

    - name: Print full event
      ansible.builtin.debug:
        var: rhacs_webhook_payload
      when:
        - rhacs_webhook_payload is defined

    - name: Derive target_namespace from RHACS webhook when unset
      ansible.builtin.set_fact:
        target_namespace: "{{ rhacs_webhook_payload.alert.deployment.namespace }}"
      when:
        - rhacs_webhook_payload is defined
        - (target_namespace is not defined) or (target_namespace | default('') | length == 0)
        - rhacs_webhook_payload.alert.deployment is defined
        - rhacs_webhook_payload.alert.deployment.namespace is defined

    - name: Derive target_pod from RHACS webhook when unset
      ansible.builtin.set_fact:
        target_pod: "{{ rhacs_webhook_payload.alert.processViolation.processes[0].podId }}"
      when:
        - rhacs_webhook_payload is defined
        - (target_pod is not defined) or (target_pod | default('') | length == 0)
        - rhacs_webhook_payload.alert.processViolation is defined
        - rhacs_webhook_payload.alert.processViolation.processes is defined
        - rhacs_webhook_payload.alert.processViolation.processes | length > 0
        - rhacs_webhook_payload.alert.processViolation.processes[0].podId is defined

    - name: Derive policy name from RHACS alert
      ansible.builtin.set_fact:
        policy_name: "{{ rhacs_webhook_payload.alert.policy.name }}"
      when:
        - rhacs_webhook_payload is defined
        - policy_name is not defined
        - rhacs_webhook_payload.alert.policy is defined
        - rhacs_webhook_payload.alert.policy.name is defined

    - name: Fail when required target vars are missing
      ansible.builtin.assert:
        that:
          - target_namespace is defined and target_namespace | length > 0
          - target_pod is defined and target_pod | length > 0
        fail_msg: "Set target_namespace and target_pod (or pass rhacs_webhook_payload from RHACS/EDA)."

  tasks:
    - name: Look up pod
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ target_namespace }}"
        name: "{{ target_pod }}"
      register: pod_query

    - name: Fail if pod not found
      ansible.builtin.assert:
        that:
          - pod_query.resources | length == 1
        fail_msg: "Pod {{ target_pod }} not found in namespace {{ target_namespace }}."

    - name: Derive facts from pod
      ansible.builtin.set_fact:
        pod_obj: "{{ pod_query.resources[0] }}"
        target_node: "{{ pod_query.resources[0].spec.nodeName }}"
        _pod_container_names: >-
          {{
            (
              (pod_query.resources[0].spec.containers | default([]) | map(attribute='name') | list)
              + (pod_query.resources[0].spec.initContainers | default([]) | map(attribute='name') | list)
            ) | unique | list
          }}
        target_container: "{{ target_container
          | default((pod_query.resources[0].spec.containers | first).name) }}"

    - name: Compute NetworkPolicy matchLabels from pod metadata
      ansible.builtin.set_fact:
        networkpolicy_match_labels: "{{ networkpolicy_match_labels | default(pod_obj.metadata.labels | default({})) }}"

    - name: Set evidence directory
      ansible.builtin.set_fact:
        evidence_dir: >-
          {{
            evidence_dir
            | default(lookup('env', 'HOME') ~ '/rhacs-ir-evidence/'
              ~ ansible_date_time.iso8601_basic_short)
          }}

    - name: Create evidence directory
      ansible.builtin.file:
        path: "{{ evidence_dir }}"
        state: directory
        mode: "0700"

    - name: Save pod manifest (sanitized context)
      ansible.builtin.copy:
        dest: "{{ evidence_dir }}/pod-{{ target_pod }}.yaml"
        mode: "0600"
        content: "{{ pod_obj | to_nice_yaml }}"

    - name: Fetch container logs (current)
      kubernetes.core.k8s_log:
        namespace: "{{ target_namespace }}"
        name: "{{ target_pod }}"
        container: "{{ item }}"
      loop: "{{ _pod_container_names }}"
      loop_control:
        label: "{{ item }}"
      register: pod_logs_per_container
      ignore_errors: true
      tags: [logs]

    - name: Write container logs to evidence
      ansible.builtin.copy:
        dest: "{{ evidence_dir }}/pod-{{ target_pod }}-{{ item.item }}.log"
        mode: "0600"
        content: "{{ item.log }}"
      loop: "{{ pod_logs_per_container.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.log is defined
      tags: [logs]

    - name: Try previous-instance container logs
      kubernetes.core.k8s_log:
        namespace: "{{ target_namespace }}"
        name: "{{ target_pod }}"
        container: "{{ item }}"
        previous: true
      loop: "{{ _pod_container_names }}"
      loop_control:
        label: "{{ item }}"
      register: pod_logs_prev_per_container
      ignore_errors: true
      tags: [logs]

    - name: Write previous logs if present
      ansible.builtin.copy:
        dest: "{{ evidence_dir }}/pod-{{ target_pod }}-{{ item.item }}-previous.log"
        mode: "0600"
        content: "{{ item.log }}"
      loop: "{{ pod_logs_prev_per_container.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.log is defined and (item.log | length) > 0
      tags: [logs]

    - name: Capture kubelet unit logs from node (oc)
      ansible.builtin.command:
        argv: >-
          {{
            ['oc', '--server=' ~ host, '--token=' ~ bearer_token]
            + (['--insecure-skip-tls-verify=true'] if not verify_ssl else [])
            + ['adm', 'node-logs', target_node, '-u', 'kubelet',
               '--tail=' ~ (node_log_tail | default(5000) | string)]
          }}
      register: node_logs_kubelet
      changed_when: false
      when: enable_nodelog_collection | default(true) | bool
      no_log: true
      tags: [logs]

    - name: Capture crio unit logs from node (oc)
      ansible.builtin.command:
        argv: >-
          {{
            ['oc', '--server=' ~ host, '--token=' ~ bearer_token]
            + (['--insecure-skip-tls-verify=true'] if not verify_ssl else [])
            + ['adm', 'node-logs', target_node, '-u', 'crio',
               '--tail=' ~ (node_log_tail | default(5000) | string)]
          }}
      register: node_logs_crio
      changed_when: false
      when: enable_nodelog_collection | default(true) | bool
      tags: [logs]

    - name: Write kubelet node logs
      ansible.builtin.copy:
        dest: "{{ evidence_dir }}/node-{{ target_node }}-kubelet.log"
        mode: "0600"
        content: "{{ node_logs_kubelet.stdout }}"
      when: enable_nodelog_collection | default(true) | bool and node_logs_kubelet is not failed
      tags: [logs]

    - name: Write crio node logs
      ansible.builtin.copy:
        dest: "{{ evidence_dir }}/node-{{ target_node }}-crio.log"
        mode: "0600"
        content: "{{ node_logs_crio.stdout }}"
      when: enable_nodelog_collection | default(true) | bool and node_logs_crio is not failed
      tags: [logs]

    - name: Trigger kubelet forensic checkpoint (POST node proxy)
      when: enable_checkpoint_collection | default(true) | bool
      ansible.builtin.uri:
        url: >-
          {{ host }}/api/v1/nodes/{{ target_node }}/proxy/checkpoint/{{
          target_namespace | urlencode }}/{{ target_pod | urlencode }}/{{
          target_container | urlencode }}
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ bearer_token }}"
        validate_certs: "{{ verify_ssl }}"
        status_code: [200, 201, 202]
        timeout: 300
      register: checkpoint_response
      failed_when: false
      tags: [checkpoint]

    - name: Save checkpoint API response
      ansible.builtin.copy:
        dest: "{{ evidence_dir }}/checkpoint-response.json"
        mode: "0600"
        content: "{{ checkpoint_response | to_nice_json }}"
      when: enable_checkpoint_collection | default(true) | bool and checkpoint_response is defined
      tags: [checkpoint]

    - name: Note checkpoint failure (check CRI-O CRIU / permissions)
      ansible.builtin.debug:
        msg: >-
          Checkpoint HTTP {{ checkpoint_response.status | default('n/a') }} —
          see {{ evidence_dir }}/checkpoint-response.json.
          If 403/404, confirm RBAC nodes/proxy CREATE and CRIU enablement on workers.
      when:
        - enable_checkpoint_collection | default(true) | bool
        - checkpoint_response.status | default(200) not in [200, 201, 202]
      tags: [checkpoint]

    - name: Apply deny-all NetworkPolicy for matched pod labels
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', playbook_dir + '/../templates/networkpolicy-deny-all.yaml.j2') | from_yaml }}"
      tags: [networkpolicy]

    - name: Summary
      ansible.builtin.debug:
        msg: >-
          Evidence under {{ evidence_dir }}.
          Target namespace {{ target_namespace }} (NetworkPolicy only if tag networkpolicy ran).
          {% if evidence_publish_enabled | default(true) | bool %}
          Publish phase will zip evidence and expose an HTTP download (tag publish).
          {% endif %}

  post_tasks:
    - name: Set evidence publish id
      ansible.builtin.set_fact:
        _rhacs_evidence_publish_id: "{{ 'rhacs-ir-evidence-' ~ ansible_date_time.epoch }}"
      when: evidence_publish_enabled | default(true) | bool
      tags: [publish]

    - name: Set evidence publish defaults
      ansible.builtin.set_fact:
        evidence_publish_enabled: "{{ evidence_publish_enabled | default(true) | bool }}"
        evidence_ir_namespace: "{{ evidence_ir_namespace | default('rhacs-incident-response') }}"
        evidence_nginx_image: "{{ evidence_nginx_image | default('registry.access.redhat.com/hi/nginx:latest') }}"
        evidence_nginx_pod_name: "{{ evidence_nginx_pod_name | default(_rhacs_evidence_publish_id) }}"
        evidence_service_name: "{{ evidence_service_name | default(_rhacs_evidence_publish_id) }}"
        evidence_archive_name: "{{ evidence_archive_name | default('rhacs-evidence-' ~ ansible_date_time.iso8601_basic_short ~ '.zip') }}"
        evidence_nginx_mount_path: "{{ evidence_nginx_mount_path | default('/usr/share/nginx/html') }}"
        evidence_nginx_container_port: "{{ evidence_nginx_container_port | default(8080) }}"
        evidence_nginx_container_name: "{{ evidence_nginx_container_name | default('nginx') }}"
        evidence_stager_container_name: "{{ evidence_stager_container_name | default('evidence-stager') }}"
        evidence_stager_image: "{{ evidence_stager_image | default('registry.access.redhat.com/ubi9:latest') }}"
        evidence_service_port: "{{ evidence_service_port | default(8080) }}"
        evidence_create_route: "{{ evidence_create_route | default(true) | bool }}"
      when: evidence_publish_enabled | default(true) | bool
      tags: [publish]

    - name: Set evidence archive path
      ansible.builtin.set_fact:
        evidence_archive_path: "{{ evidence_dir | dirname }}/{{ evidence_archive_name }}"
      when: evidence_publish_enabled | default(true) | bool
      tags: [publish]

    - name: Archive collected evidence
      community.general.archive:
        path: "{{ evidence_dir }}/"
        dest: "{{ evidence_archive_path }}"
        format: zip
      when: evidence_publish_enabled | default(true) | bool
      tags: [publish]

    - name: Deploy evidence nginx pod
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', playbook_dir + '/../templates/evidence-nginx-pod.yaml.j2') | from_yaml }}"
      register: evidence_nginx_pod
      when: evidence_publish_enabled | default(true) | bool
      tags: [publish]

    - name: Wait for evidence nginx pod to be Ready
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ evidence_ir_namespace }}"
        name: "{{ evidence_nginx_pod_name }}"
      register: evidence_pod_status
      until:
        - evidence_pod_status.resources | length > 0
        - evidence_pod_status.resources[0].status.phase == 'Running'
        - evidence_pod_status.resources[0].status.containerStatuses is defined
        - >-
          (evidence_pod_status.resources[0].status.containerStatuses
          | selectattr('ready', 'equalto', true) | list | length)
          == (evidence_pod_status.resources[0].status.containerStatuses | length)
      retries: 24
      delay: 5
      when: evidence_publish_enabled | default(true) | bool
      tags: [publish]

    - name: Stat evidence archive on execution host
      ansible.builtin.stat:
        path: "{{ evidence_archive_path }}"
      register: evidence_archive_stat
      failed_when: >-
        not evidence_archive_stat.stat.exists
        or (evidence_archive_stat.stat.size | default(0) | int) < 1
      when: evidence_publish_enabled | default(true) | bool
      tags: [publish]

    - name: Copy evidence archive into evidence pod (stager container has tar)
      kubernetes.core.k8s_cp:
        namespace: "{{ evidence_ir_namespace }}"
        pod: "{{ evidence_nginx_pod_name }}"
        container: "{{ evidence_stager_container_name }}"
        local_path: "{{ evidence_archive_path }}"
        remote_path: "{{ evidence_nginx_mount_path }}/{{ evidence_archive_name }}"
        state: to_pod
      when: evidence_publish_enabled | default(true) | bool
      tags: [publish]

    - name: Verify evidence archive is present in shared volume
      kubernetes.core.k8s_exec:
        namespace: "{{ evidence_ir_namespace }}"
        pod: "{{ evidence_nginx_pod_name }}"
        container: "{{ evidence_stager_container_name }}"
        command: >-
          /bin/sh -c "test -s {{ evidence_nginx_mount_path }}/{{ evidence_archive_name }}
          && ls -la {{ evidence_nginx_mount_path }}"
      register: evidence_copy_verify
      changed_when: false
      failed_when: evidence_copy_verify.rc | default(1) | int != 0
      when: evidence_publish_enabled | default(true) | bool
      tags: [publish]

    - name: Deploy evidence download Service
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', playbook_dir + '/../templates/evidence-nginx-service.yaml.j2') | from_yaml }}"
      when: evidence_publish_enabled | default(true) | bool
      tags: [publish]

    - name: Deploy evidence download Route
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', playbook_dir + '/../templates/evidence-nginx-route.yaml.j2') | from_yaml }}"
      when:
        - evidence_publish_enabled | default(true) | bool
        - evidence_create_route | default(true) | bool
      tags: [publish]

    - name: Read Route for external download URL
      kubernetes.core.k8s_info:
        api_version: route.openshift.io/v1
        kind: Route
        namespace: "{{ evidence_ir_namespace }}"
        name: "{{ evidence_service_name }}"
      register: evidence_route_info
      when:
        - evidence_publish_enabled | default(true) | bool
        - evidence_create_route | default(true) | bool
      tags: [publish]

    - name: Publish summary
      ansible.builtin.debug:
        msg: >-
          Evidence collected under {{ evidence_dir }}.
          Archive: {{ evidence_archive_path }}.
          Nginx pod {{ evidence_nginx_pod_name }} in namespace {{ evidence_ir_namespace }}
          (image {{ evidence_nginx_image }}).
          In-cluster download:
          http://{{ evidence_service_name }}.{{ evidence_ir_namespace }}.svc:{{
          evidence_service_port }}/{{ evidence_archive_name }}.
          {% if evidence_create_route | default(true) | bool and evidence_route_info.resources | default([]) | length > 0 %}
          External download:
          https://{{ evidence_route_info.resources[0].status.ingress[0].host | default(evidence_route_info.resources[0].spec.host) }}/{{ evidence_archive_name }}.
          {% endif %}
          Cleanup when done:
          oc delete pod,svc,route -n {{ evidence_ir_namespace }} -l app=rhacs-ir-evidence
      when: evidence_publish_enabled | default(true) | bool
      tags: [publish]
