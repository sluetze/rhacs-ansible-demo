---
# Copy to aap-eda-vars.yml (do not commit) and pass: -e @aap-eda-vars.yml
#
# Required for configure_aap_eda.yml — connection to AAP (pick one style):
# aap_gateway_host: "https://security-aap-aap.apps.example.com"
# aap_oauth_token: "<token from AAP UI → User → Tokens>"
#
# Or separate Controller / EDA endpoints (base URL only — no /api/controller or /api/eda):
# aap_controller_host: "https://security-aap-aap.apps.example.com"
# aap_controller_username: admin
# aap_controller_password: "change-me"
# eda_controller_host: "https://security-aap-aap.apps.example.com"
# eda_username: admin                    # optional; defaults to aap_controller_username
# eda_password: "change-me"              # optional; defaults to aap_controller_password
#
# aap_project_scm_url: "https://github.com/your-org/rhacs-ansible-demo.git"
#
# OpenShift API for the Controller credential (rhacs-ir-runner token):
# ocp_api: "https://api.cluster.example.com:6443"
# ocp_token: "<rhacs-ir-runner-token>"
#
# Execution environment — shared registry login (same account for base pull and EE push):
# aap_ee_image_repository: quay.io/your-user/rhacs-ir-ee
# aap_configure_execution_environment: true
# aap_build_execution_environment: true
# aap_ee_registry_username: your-user
# aap_ee_registry_password: "change-me"
#
# Split registry login (e.g. Red Hat base image, Quay push):
# aap_ee_base_image: registry.redhat.io/ansible-automation-platform-26/ee-minimal-rhel9:latest
# aap_ee_base_registry_username: "<redhat-account>"
# aap_ee_base_registry_password: "<redhat-token>"
# aap_ee_push_registry_username: your-quay-user
# aap_ee_push_registry_password: "<quay-token>"
#
# RHACS → EDA event stream HTTP basic auth (optional; defaults to controller user/password):
# eda_event_stream_username: rhacs-webhook
# eda_event_stream_password: "change-me"
#
# Playbook behavior (checkpoint, node logs, evidence publish) is set on the AAP job template,
# not here. See example-extra-vars.yml and README.
