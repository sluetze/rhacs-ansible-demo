# OpenShift 4.17+ / Kubernetes 1.30+: apiserver must authorize nodes/checkpoint before
# proxying POST /checkpoint/{ns}/{pod}/{container} to the kubelet.
# Apply with: oc apply -k infra/rbac/  (included in kustomization.yaml)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-apiserver-checkpoints
rules:
  - apiGroups: [""]
    resources: ["nodes/checkpoint"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-apiserver-checkpoints
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-apiserver-checkpoints
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: kube-apiserver
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: system:kube-apiserver
