---
# Source template: templates/execution-environment.yml.j2
# configure_aap_eda.yml renders this into .build/execution-environment.yml before ansible-builder runs.
# Manual build (after podman login — see README):
#   ansible-builder build -f .build/execution-environment.yml -t <repo>:<tag>
version: 3

images:
  base_image:
    name: quay.io/ansible/ansible-execution-env-base:latest

dependencies:
  ansible_core:
    package_pip: ansible-core>=2.15
  ansible_runner:
    package_pip: ansible-runner
  galaxy: collections/requirements.yml
  python: requirements.txt
  system: bindep.txt
