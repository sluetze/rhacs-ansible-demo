---
# Event-Driven Ansible rulebook: RHACS generic webhook -> Automation Controller job template.
# Deploy as a Rulebook Activation in AAP with a Decision Environment that includes ansible.eda.
#
# Configure the RHACS integration "Endpoint" to POST to the activation's webhook URL and
# optional Bearer token that matches `webhook_token` below.
#
# Activation extra vars (see vars/aap_eda_defaults.yml): job_template_name, aap_organization,
# webhook_token (embedded webhook only). OpenShift API auth is on the Controller job template credential.
# Playbook behavior vars (enable_checkpoint_collection, enable_nodelog_collection, etc.) belong on the job template in AAP.
#
- name: RHACS policy violation webhook
  hosts: all

  sources:
    - name: rhacs_alerts
      ansible.eda.webhook:
        host: 0.0.0.0
        port: "{{ webhook_port | default(5000) | int }}"
        token: "{{ webhook_token | default('change-me') }}"

  rules:
    - name: RHACS runtime process violation
      # Event stream (pg_listener) wraps RHACS body in payload; use bracket notation so
      # ansible-rulebook does not treat keys like "deployment" as standalone Jinja vars.
      condition: event.payload['alert']['processViolation'] is defined
      action:
        run_job_template:
          name: "{{ job_template_name | default('RHACS Contain Runtime Violation') }}"
          organization: "{{ aap_organization | default('Default') }}"
          job_args:
            extra_vars:
              rhacs_webhook_payload: "{{ event.payload }}"
              target_namespace: "{{ event.payload['alert']['namespace'] }}"
              target_pod: "{{ event.payload['alert']['processViolation']['processes'][0]['podId'] }}"
              # OpenShift API auth and playbook behavior (checkpoint, node logs, publish) come from the job template in AAP.
    - name: Debug the event payload
      condition: event.payload is defined
      action:
        run_job_template:
          name: test_eda
          organization: Default
