---
# Copy to extra-vars.yml (do not commit) and fill in OCP API + SA token.
# Example: ansible-playbook playbooks/contain_runtime_violation.yml -e @extra-vars.yml
#
# host: "https://api.ocp.example.com:6443"
# bearer_token: "<token from: oc get secret rhacs-ir-runner-token -n rhacs-incident-response -o jsonpath='{.data.token}' | base64 -d>"
# verify_ssl: true
#
# target_namespace: "demo-app"
# target_pod: "malicious-pod-xxxxx"
# target_container: "app"
#
# Optional:
# skip_checkpoint: true
# use_oc_for_node_logs: true   # requires oc CLI on controller where playbook runs
# networkpolicy_name: rhacs-ir-deny-all
#
# Evidence publish (zip + Red Hat Hummingbird nginx download pod in rhacs-incident-response):
# evidence_publish_enabled: true
# evidence_publish_enabled: false   # local runs without publish Role applied
# evidence_nginx_image: registry.access.redhat.com/hi/nginx:latest
# evidence_stager_image: registry.access.redhat.com/ubi9/ubi-minimal:latest
# Inspect files with: oc exec -n rhacs-incident-response POD -c nginx -- ls -la /usr/share/nginx/html
# (oc debug uses a separate ephemeral container and will not show the copied zip)
# evidence_ir_namespace: rhacs-incident-response
# evidence_create_route: true
