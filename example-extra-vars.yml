---
# Copy to extra-vars.yml (do not commit). Used for local ansible-playbook runs and as a
# reference for AAP job template extra variables.
#
# Example:
#   ansible-playbook playbooks/contain_runtime_violation.yml -e @extra-vars.yml
#
# host: "https://api.ocp.example.com:6443"
# bearer_token: "<rhacs-ir-runner-token>"
# verify_ssl: false
#
# target_namespace: demo-app
# target_pod: malicious-pod-xxxxx
#
# Playbook behavior (set these on the AAP job template for EDA-driven runs):
# enable_checkpoint_collection: false   # default true; set false when CRI-U is off
# enable_nodelog_collection: false      # default true; RHACS IR EE installs oc from mirror.openshift.com
# evidence_publish_enabled: false
#
# Optional tuning:
# target_container: app
# networkpolicy_name: rhacs-ir-deny-all
# node_log_tail: 5000
# evidence_ir_namespace: rhacs-incident-response
# evidence_nginx_image: registry.access.redhat.com/hi/nginx:latest
# evidence_create_route: true
